name: 'Allure3-Katalon Bridge'
description: 'Zero-touch Allure 3 reporting for Katalon Studio - no plugin, no OSGi packaging, no test script changes.'
author: 'Monty Bagati'
branding:
  icon: 'bar-chart-2'
  color: 'orange'

inputs:
  project-path:
    description: 'Path to the Katalon Studio project (the folder containing the .prj file)'
    required: false
    default: '.'
  force:
    description: 'Also overwrite a customized allure3.properties/allurerc.mjs with the shipped default'
    required: false
    default: 'false'
  vendor-cli:
    description: 'Copy the Allure 3 CLI into the project, so it keeps working on a runner that never ran the installer'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install/upgrade Allure3-Katalon Bridge
      shell: bash
      run: |
        args=()
        if [ "${{ inputs.force }}" = "true" ]; then
          args+=(--force)
        fi
        if [ "${{ inputs.vendor-cli }}" = "true" ]; then
          args+=(--vendor-cli)
        fi
        # Guarded expansion: an empty array is an unbound variable under
        # bash 4.3 and older, which macOS still ships.
        npx allure3-katalon-bridge install "${{ inputs.project-path }}" ${args[@]+"${args[@]}"}
