# Allure3-Katalon Bridge configuration
# ------------------------------------------------------------------
# Every key here can be overridden without touching this file by setting
# an environment variable named ALLURE3_<KEY_IN_UPPER_SNAKE_CASE>, e.g.
#   allure3.results.dir      -> ALLURE3_RESULTS_DIR
#   allure3.enabled          -> ALLURE3_ENABLED
# This lets each CI environment point results wherever it needs to
# without forking this file.

# Master switch. Set to false to disable Allure reporting entirely
# (e.g. for a quick local debug run) without removing the listener.
allure3.enabled=true

# Where allure-results (the raw JSON Allure reads) are written.
# Relative paths are resolved against the Katalon project root.
# The format written here is the Allure 2 results format, which Allure 3
# reads natively through its built-in allure2 reader - that is why the
# Java side of this bridge is unchanged from the Allure 2 bridge.
allure3.results.dir=allure-results

# true (default): delete this folder's leftover *-result.json/
# *-container.json/*-attachment* files from an earlier, unrelated run
# before writing new ones, so each generated report reflects only the run
# it's named after (never touches environment.properties, executor.json,
# or categories.json). Does NOT clear between the Test Suites of one Test
# Suite Collection run - those are meant to combine into one report. Set
# to false if you run multiple *unrelated* suites in true parallel against
# this same folder.
allure3.clean.results.before.run=true

# Attach a screenshot automatically when a test case does NOT pass.
# Only takes effect if a WebUI browser session is active; silently
# skipped for API/Mobile-only test cases.
allure3.attach.screenshot.on.failure=true

# Attach a screenshot for every test case, pass or fail. Off by default
# because it bloats allure-results on large WebUI suites.
allure3.attach.screenshot.always=false

# ------------------------------------------------------------------
# Test identity - read this before turning it off
# ------------------------------------------------------------------
# true (default): write the suite name as an Allure parameter, so the same
# reusable test case run from two different suites stays two distinct
# tests in the report.
#
# Allure 3 groups retries by md5(testCaseId : parametersHash :
# environmentId) and displays only the newest attempt in each group. It
# ignores the historyId a result declares and recomputes its own. Katalon
# reuses one test case across many suites under a single testCaseId, so
# without this parameter all of those runs collapse into one test, and a
# failure in any run except the last is hidden - the report reads
# "passed" for a run that actually failed.
#
# Only set this to false if you genuinely want cross-suite runs of one
# test case treated as retries of each other.
allure3.separate.suites.as.parameters=true

# true (default): also write the active browser as an Allure parameter, on
# top of the "browser" label that allurerc.mjs matches environments on.
#
# The label alone separates tests in the report body but not in history:
# Allure 3 computes historyId as "testCase.id + hash(parameters)" with no
# environment component, so one suite+test case run against two browsers
# shares a single history entry. The newest run overwrites the other, a
# browser-specific failure disappears from Trend, and the test is flagged
# flaky for a pass/fail pair that was really two different browsers.
allure3.separate.browsers.as.parameters=true

# Path (relative to project root, or absolute) to the categories.json
# template that classifies failures in the Allure "Categories" tab.
# Allure 3 still reads this Allure 2 file natively; you can alternatively
# express the same rules in allurerc.mjs, which wins where both exist.
allure3.categories.file=Include/config/allure3/categories.json

# ------------------------------------------------------------------
# Report generation
# ------------------------------------------------------------------
# Automatically generate the report at the end of every run, so a finished
# HTML report is already sitting on disk with no extra step.
# Generate-only - never auto-opens a browser or starts a server, so it's
# safe to leave on for CI too.
allure3.auto.generate.report=true

# Base folder the HTML report is written under. Each run gets its own
# "<Name>_<yyyyMMdd_HHmmss>" here so repeated runs don't overwrite each
# other. <Name> is a Test Suite Collection's name if you ran one,
# otherwise the Test Suite's name, or a lone Test Case's own name if run
# directly. A Test Suite Collection produces exactly one combined report,
# not one per Test Suite.
allure3.report.dir=allure-report

# true (default): each run produces one self-contained ".html" file that
# opens correctly straight from a double-click (file://), no server
# needed. This runs "allure awesome --single-file", because Allure 3
# exposes --single-file on the report plugin rather than on "generate".
# false: produces a "<Name>_<timestamp>/" folder instead, viewable with
# "allure open". Only turn this off for very large suites, where one huge
# single HTML file gets slow to load.
allure3.report.single.file=true

# The JSONL file Allure 3 accumulates run history in, for the Trend and
# Retries views. This replaces Allure 2's history/ directory: because it
# lives outside the report rather than inside it, single-file reports now
# carry history forward too - something the Allure 2 bridge could not do.
# Set to an empty value to disable history accumulation.
allure3.history.file=allure-history.jsonl

# The allurerc config file passed to the CLI with -c. The installer
# generates one at the project root, mapping each browser the bridge sees
# to an Allure 3 environment. Anything declared there (environments,
# categories, quality gate, variables) wins over what the bridge passes on
# the command line.
allure3.config.file=allurerc.mjs

# How long to wait for report generation before giving up. Allure 3 is
# markedly faster than Allure 2 (a six-result run generates in well under
# a second), but very large result sets still take time.
allure3.generate.timeout.seconds=120

# ------------------------------------------------------------------
# CLI location - normally leave these alone
# ------------------------------------------------------------------
# The installer pins Allure 3 as an npm dependency and records both the
# CLI entry point and the node executable it resolved, in
# .allure3-bridge/cli.json. These two keys only exist for setups where
# that record is missing or points somewhere stale - for example a
# project committed to git and then checked out on a different machine
# without re-running the installer.
#allure3.cli.path=
#allure3.node.path=

# true (default): automatically turn each test case's own Katalon
# execution log (every keyword/script line it already records, complete
# with pass/fail per line) into nested Allure steps - no test script
# changes needed. This reads an already-written, already-closed log file
# per test case, so it can never affect the actual test outcome.
allure3.capture.steps=true

# Write allure3-step-diag.txt in the project root, recording how each test
# case's step parsing went: which log folder was read, how many steps came
# back, and any exception along the way.
#
# Off by default. Turn it on only while investigating steps that are
# missing from a report, then turn it back off: it appends on every run,
# and it sits in the project root where it would otherwise follow the
# project into git and CI artifacts. Even when on it is capped, starting
# a fresh file once it passes 1 MB rather than growing without end.
allure3.step.diag.enabled=false
